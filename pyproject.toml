[project]
name = "infraestructura-oti"
version = "0.1.0"
description = "Sistema institucional Infraestructura - OTI (Sprint 01: autenticación)"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.11.2",
    "psycopg[binary]>=3.2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"apps/administration/forms.py" = ["E501"]
"apps/administration/migrations/*" = ["E501"]
"apps/catalogs/forms.py" = ["E501"]
"apps/catalogs/urls.py" = ["E501"]
"apps/catalogs/migrations/*" = ["E501"]
"apps/internet/forms.py" = ["E501"]
"apps/internet/models.py" = ["E501"]
"apps/internet/services/business.py" = ["E501"]
"apps/internet/views.py" = ["E501"]
"apps/internet/urls.py" = ["E501"]
"apps/internet/migrations/*" = ["E501"]
"tests/test_internet_sprint04.py" = ["E501"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "apps*"]
