{% extends "base.html" %}
{% load static %}

{% block body %}
  <div class="relative min-h-screen overflow-x-hidden">
    <div
      class="pointer-events-none absolute inset-0 opacity-[0.35]"
      aria-hidden="true"
      style="background-image: url('{% static 'images/network-pattern.svg' %}'); background-size: 480px 480px;"
    ></div>

    <main class="relative flex min-h-screen items-center justify-center px-4 py-8 sm:px-6">
      <h1 class="sr-only">Infraestructura - OTI</h1>
      <div
        class="w-full max-w-5xl overflow-hidden rounded-2xl bg-white shadow-card ring-1 ring-slate-100"
      >
        <div class="grid grid-cols-1 lg:grid-cols-2">
          <section class="order-1 border-b border-slate-100 lg:order-none lg:border-b-0 lg:border-r">
            {% include "accounts/_branding_panel.html" %}
          </section>
          <section class="order-2 px-6 py-8 sm:px-10 sm:py-10 lg:px-12">
            {% block auth_content %}{% endblock %}
          </section>
        </div>
      </div>
    </main>
  </div>
{% endblock %}
