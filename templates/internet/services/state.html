{% extends "administration/base_dashboard.html" %}
{% block title %}Estado — {{ service.code }}{% endblock %}
{% block dashboard_content %}
  <div class="mx-auto max-w-lg rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-100">
    <h1 class="text-xl font-bold">Cambiar estado — {{ service.code }}</h1>
    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="flex justify-end gap-2">
        <a href="{% url 'internet:service_list' %}" class="rounded-lg border px-4 py-2 text-sm">Cancelar</a>
        <button type="submit" class="btn-primary !w-auto px-4 py-2 text-sm">Guardar</button>
      </div>
    </form>
  </div>
{% endblock %}
